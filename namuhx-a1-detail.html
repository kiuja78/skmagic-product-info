<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>나무엑스 A1 · 공식 원본 상세정보</title>
<style>
  html,body{margin:0;padding:0;background:#fff;color:#183342}
  #namuhx-original-view{width:100%;max-width:1080px;margin:0 auto}
  .load-state{padding:32px 20px;text-align:center;font:15px/1.6 system-ui,-apple-system,sans-serif;color:#476174}
  /* 구매·판매 페이지로 이동하는 외부 원본링크는 노출하지 않습니다. */
  .namuhx-original-detail .nhx-original-source{display:none}
  #nhx-subdetail-dialog .nhx-subactions a{display:none!important}
</style>
<script defer src="./namuhx_subdetails.js?v=1"></script>
<script defer src="./namuhx_detail.js?v=4"></script>
</head>
<body>
<main id="namuhx-original-view" aria-label="나무엑스 A1 제조사 원본 제품 설명">
<p class="load-state">나무엑스 공식 원본 상세정보를 불러오는 중입니다.</p>
</main>
<script>
document.addEventListener('DOMContentLoaded',function(){
  var el=document.getElementById('namuhx-original-view');
  if(window.NAMUHX_DETAIL&&typeof window.NAMUHX_DETAIL.render==='function'){
    el.innerHTML=window.NAMUHX_DETAIL.render();
  }else{
    el.innerHTML='<p class="load-state" role="alert">원본 상세정보를 불러오지 못했습니다. 인터넷 연결과 페이지 새로고침을 확인해 주세요.</p>';
  }
});
</script>
</body>
</html>
