<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>나무엑스 A1 · 공식 원본 상세정보</title>
<style>
  html,body{margin:0;padding:0;background:#fff;color:#183342}
  #namuhx-original-view{width:100%;max-width:1080px;margin:0 auto}
  .load-state{padding:32px 20px;text-align:center;font:15px/1.6 system-ui,-apple-system,sans-serif;color:#476174}
  /* 구매·판매 페이지로 이동하는 외부 원본링크는 노출하지 않습니다. */
  .namuhx-original-detail .nhx-original-source{display:none}
  #nhx-subdetail-dialog .nhx-subactions a{display:none!important}

  /* 원본 이미지가 404일 때 브라우저의 긴 alt 문구가 겹치지 않도록 보호 */
  .namuhx-original-detail .nhx-original-body img{font-size:0;color:transparent}
  .nhx-spec-fallback{background:#1b1b1b;color:#f7f7f7;padding:clamp(20px,4.2vw,50px) clamp(18px,5.3vw,64px);border-top:1px solid #343434;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;line-height:1.8}
  .nhx-spec-fallback h3{font-size:clamp(20px,3vw,31px);font-weight:750;line-height:1.4;margin:0 0 15px}
  .nhx-spec-fallback p{font-size:clamp(13px,1.8vw,16px);color:#e1e1e1;line-height:1.9;margin:0;white-space:normal;overflow-wrap:anywhere;word-break:keep-all}
</style>
<script defer src="./namuhx_subdetails.js?v=1"></script>
<script defer src="./namuhx_detail.js?v=4"></script>
</head>
<body>
<main id="namuhx-original-view" aria-label="나무엑스 A1 제조사 원본 제품 설명">
<p class="load-state">나무엑스 공식 원본 상세정보를 불러오는 중입니다.</p>
</main>
<script>
document.addEventListener('DOMContentLoaded',function(){
  var el=document.getElementById('namuhx-original-view');
  if(window.NAMUHX_DETAIL&&typeof window.NAMUHX_DETAIL.render==='function'){
    el.innerHTML=window.NAMUHX_DETAIL.render();
    // 고정 이미지 URL이 오래되어 표시되지 않을 경우 dpl 캐시값을 제거하고 1회 재시도.
    // 실패한 규격 이미지의 내용은 원본 스크립트에 있는 alt 문구만 사용합니다.
    el.querySelectorAll('.nhx-original-body img').forEach(function(img){
      var showFallback=function(){
        if(img.dataset.nhxErrorDone==='1')return;
        img.dataset.nhxErrorDone='1';
        var figure=img.closest('figure');
        if(!figure)return;
        var src=img.getAttribute('src')||'';
        if(/\/s11_0[23]\./.test(src)){
          var originalText=img.getAttribute('alt')||'';
          var split=originalText.indexOf(' — ');
          var heading=split>=0?originalText.slice(0,split):'제품 규격';
          var description=(split>=0?originalText.slice(split+3):originalText).replace(/[·,\s]+$/,'');
          var replacement=document.createElement('section');
          replacement.className='nhx-spec-fallback';
          replacement.setAttribute('aria-label',heading+' · 원본 규격 설명');
          var h3=document.createElement('h3');
          h3.textContent=heading;
          var p=document.createElement('p');
          p.textContent=description;
          replacement.appendChild(h3);
          replacement.appendChild(p);
          figure.replaceWith(replacement);
        }else{
          // 다른 원본 이미지도 로드되지 않으면 깨진 아이콘/대체문구를 표시하지 않음.
          figure.remove();
        }
      };
      var handleFailure=function(){
        if(img.dataset.nhxRetry!=='1'){
          img.dataset.nhxRetry='1';
          try{
            var url=new URL(img.src,document.baseURI);
            if(url.searchParams.has('dpl')){
              url.searchParams.delete('dpl');
              img.src=url.href;
              return;
            }
          }catch(e){}
        }
        showFallback();
      };
      img.addEventListener('error',handleFailure);
      if(img.complete && img.naturalWidth===0)handleFailure();
    });
  }else{
    el.innerHTML='<p class="load-state" role="alert">원본 상세정보를 불러오지 못했습니다. 인터넷 연결과 페이지 새로고침을 확인해 주세요.</p>';
  }
});
</script>
</body>
</html>
