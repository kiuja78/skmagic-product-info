name: Deploy SK Magic Product Info

on:
  push:
    branches: [main]
    paths:
      - 'site.zip'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and validate site
        shell: bash
        run: |
          set -euo pipefail
          test -s site.zip || { echo 'Root-level site.zip is missing'; exit 1; }
          rm -rf _site
          mkdir -p _site
          unzip -q site.zip -d _site
          for asset in index.html app.js styles.css data.js reference_rates.json apple-touch-icon.png icon-192.png icon-512.png favicon.ico favicon-32.png site.webmanifest; do
            test -s "_site/$asset" || { echo "Missing asset: $asset"; exit 1; }
          done
          grep -q 'SK_MONTH_ARCHIVE' _site/data.js
          grep -q 'V6.11.1' _site/index.html
          grep -q 'apple-touch-icon.png' _site/index.html
          echo 'Validated SK Magic V6.11.1, product DB and mobile icons.'

      - name: Keep Pages branch build consistent
        shell: bash
        run: |
          set -euo pipefail
          cp _site/index.html _site/styles.css _site/app.js _site/data.js _site/reference_rates.json ./
          cp _site/apple-touch-icon.png _site/icon-192.png _site/icon-512.png _site/favicon-32.png _site/favicon.ico _site/site.webmanifest ./
          touch .nojekyll
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html styles.css app.js data.js reference_rates.json apple-touch-icon.png icon-192.png icon-512.png favicon-32.png favicon.ico site.webmanifest .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m 'Publish V6.11.1 with mobile home screen icon [skip ci]'
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
