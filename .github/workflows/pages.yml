name: Deploy SK Magic Product Info

on:
  push:
    branches: [main]
    paths:
      - 'site.zip'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and validate site
        shell: bash
        run: |
          set -euo pipefail
          test -s site.zip || { echo 'Root-level site.zip is missing'; exit 1; }
          rm -rf _site
          mkdir _site
          unzip -q site.zip -d _site
          test -s _site/index.html
          test -s _site/app.js
          test -s _site/styles.css
          test -s _site/data.js
          grep -q 'SK_MONTH_ARCHIVE' _site/data.js
          grep -q '6.6' _site/index.html
          echo 'Validated V6.6 deployment bundle.'

      - name: Keep GitHub Pages branch build consistent
        shell: bash
        run: |
          set -euo pipefail
          cp _site/index.html _site/styles.css _site/app.js _site/data.js ./
          if [ -f _site/skmagic_logo.png ]; then cp _site/skmagic_logo.png ./; fi
          touch .nojekyll
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html styles.css app.js data.js .nojekyll
          if [ -f skmagic_logo.png ]; then git add skmagic_logo.png; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Publish V6.6 website assets [skip ci]'
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
