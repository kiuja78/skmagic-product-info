name: Deploy SK Magic Product Info (current source)

on:
  push:
    branches: [main]
    paths:
      - 'site.zip'
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'data.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate current site files
        shell: bash
        run: |
          set -euo pipefail
          for asset in index.html app.js styles.css data.js reference_rates.json apple-touch-icon.png icon-192.png icon-512.png favicon.ico favicon-32.png site.webmanifest; do
            test -s "$asset" || { echo "Missing asset: $asset"; exit 1; }
          done
          grep -q 'SK_MONTH_ARCHIVE' data.js
          grep -q 'apple-touch-icon.png' index.html
          echo 'Validated latest site files.'

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
