name: Deploy SK Magic Product Info

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          rm -rf _site
          mkdir -p _site
          if [ -f .github/site_parts/part01.txt ] && [ -f .github/site_parts/part06.txt ]; then
            cat \
              .github/site_parts/part01.txt \
              .github/site_parts/part02.txt \
              .github/site_parts/part03.txt \
              .github/site_parts/part04.txt \
              .github/site_parts/part05a.txt \
              .github/site_parts/part05b.txt \
              .github/site_parts/part06.txt \
              | tr -d '\r\n' | base64 -d > /tmp/site.zip
            unzip -t /tmp/site.zip
            unzip -q /tmp/site.zip -d _site
          elif [ -f site.zip ]; then
            unzip -q site.zip -d _site
          elif [ -f .github/workflows/site.zip ]; then
            unzip -q .github/workflows/site.zip -d _site
          else
            echo "site archive is missing"
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
